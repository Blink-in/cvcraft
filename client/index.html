
<!DOCTYPE html>

    <!-- ══ Primary SEO ══ -->

    <meta name="description" content="Build a professional CV online for free. Choose from 7 ATS-optimized templates, customise colours and fonts, then download as PDF. No sign-up required." />

    <link rel="canonical" href="https://www.getcvcraft.com/" />
    <meta name="author" content="CVCraft" />

    <meta property="og:type"         content="website" />

    <!-- ══ Twitter Card ══ -->
    <meta name="twitter:card"        content="summary_large_image" />

    <meta name="twitter:image"       content="https://www.getcvcraft.com/og-image.png" />

    <!-- ══ Structured Data: WebApplication ══ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CVCraft",
      "url": "https://www.getcvcraft.com",
      "description": "Free online CV builder with ATS-optimized templates. Create and download professional CVs as PDF.",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript",
      "inLanguage": "en",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD",
        "description": "Free CV builder. Premium PDF download available."
      },
      "featureList": [
        "7 ATS-optimized CV templates",
        "Real-time live preview",
        "PDF export",
        "AI-powered cover letter writer",
        "No sign-up required"
      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "1247",
        "bestRating": "5"
      }
    }
    </script>

    <!-- ══ Structured Data: FAQPage ══ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How do I make a CV online for free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "With CVCraft, create a professional CV for free at getcvcraft.com. Choose a template, fill in your details, and download. No account needed."
          }
        },
        {
          "@type": "Question",
          "name": "What is an ATS-friendly CV template?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "An ATS-friendly CV uses clean formatting and standard headings so automated screening software can read it. CVCraft offers several ATS-optimized templates."
          }
        },
        {
          "@type": "Question",
          "name": "Can I download my CV as a PDF for free?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. CVCraft lets you print your CV to PDF for free using your browser's print dialog. A premium server-generated PDF is also available."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need to create an account to use CVCraft?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No account is required. Your CV is automatically saved in your browser and you can export a backup at any time."
          }
        }
      ]
    }
    </script>

    <!-- ══ Structured Data: Organization ══ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "CVCraft",
      "url": "https://www.getcvcraft.com",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "support@getcvcraft.com"
      }
    }
    </script>
